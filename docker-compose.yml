version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ktvidopi-postgres
    environment:
      POSTGRES_DB: ktvidopi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktvidopi-app
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ktvidopi
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
