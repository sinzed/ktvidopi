name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  release:
    types: [published]

env:
  JAVA_VERSION: '21'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.environment == 'production' }}
          tags: |
            ktvidopi:${{ github.sha }}
            ktvidopi:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Add your deployment steps here
      # Examples:
      #
      # - name: Deploy to Kubernetes
      #   run: |
      #     kubectl set image deployment/ktvidopi ktvidopi=ktvidopi:${{ github.sha }}
      #
      # - name: Deploy to Cloud Run
      #   uses: google-github-actions/deploy-cloudrun@v2
      #   with:
      #     service: ktvidopi
      #     image: gcr.io/${{ secrets.GCP_PROJECT }}/ktvidopi:${{ github.sha }}
