# Server Configuration
server.port=8080

# WebFlux Configuration (prioritize WebFlux over WebMVC)
spring.webflux.base-path=/

# Multipart Configuration (for file uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
spring.codec.max-in-memory-size=10GB

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ktvidopi}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_REPEATABLE_READ

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.ktvidopi=DEBUG

# Cloudflare R2 Configuration
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:bbee0c025a22819059074e406fca6282}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:a1bfb5509129c1dedeb3985d3def93def629a467714709b65d3c98cadbf122fb}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:https://2d05daa266a709a4f14708966c3b1539.r2.cloudflarestorage.com}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:vidopi}
cloudflare.r2.public-url-base=${CLOUDFLARE_R2_PUBLIC_URL_BASE:}
